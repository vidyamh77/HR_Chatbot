[project]
name = "hr-agentic-solution"
version = "0.1.0"
description = "HR Agentic Solution MVP 1 automating HR policy, WorkWeek HCM, and ServiceImmediately ITSM."
requires-python = ">=3.11, <3.14"
dependencies = [
    "google-adk[gcp,otel-gcp]>=2.5.0,<3.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "mcp>=2.0.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "gcsfs>=2024.11.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "google-genai",
    "anyio",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.uv]
package = false
